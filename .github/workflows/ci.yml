name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global npm@11.21.2
      - run: npm install
      - run: npm run typecheck
      - run: npm run db:migrate:local
      - run: npm test
      - run: npm run build
      - run: npm run check:worker
